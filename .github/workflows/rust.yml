name: Rust

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.88.0
    - name: Build
      run: cargo build --locked --verbose
    - name: Prepare test configuration
      run: |
        cp config/conf.yaml.example config/conf.yaml
        cp config/log4rs.yaml.example config/log4rs.yaml
    - name: Run tests
      run: cargo test --locked --verbose

  supply-chain:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.88.0
    - name: Install cargo-deny
      run: cargo install cargo-deny --locked --version "${CARGO_DENY_VERSION}"
    - name: cargo deny check
      run: cargo deny check --deny warnings
    - name: Advisory ignore expiry gate
      run: |
        python3 - <<'PY'
        import re, datetime, sys
        text = open("deny.toml").read()
        today = datetime.date.today()
        expired = sorted({m.group(1) for m in re.finditer(r'EXPIRES (\d{4}-\d{2}-\d{2})', text)
                          if datetime.date.fromisoformat(m.group(1)) < today})
        if expired:
            sys.exit(f"deny.toml advisory ignores expired: {expired}")
        PY
